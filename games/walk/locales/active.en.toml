"find.res" = "Find a ré♯."
"find.fas" = "Find a fa♯."
"find.sols" = "Find a sol♯."
"find.las" = "Find a la♯."
"l1.3.hello" = "The black keys have names too. A sharp is a note raised one notch, toward the right of the keyboard."
"l1.3.sign" = "A sharp is written with this sign: ♯. C sharp is written C♯; in French, do♯."
"l1.3.c.up" = "C, then C♯: the note goes up a notch. After me."
"l1.3.f.up" = "F, then F♯."
"l1.3.find" = "Your turn: find the black keys by their sharps."
"l1.3.guess.es" = "And E♯? Where do you think it is?"
"l1.3.guess.bs" = "And B♯?"
"l1.3.nope" = "No, it's not there. Remember: a sharp is a note raised one notch."
"l1.3.answer.es" = "E♯ is on F: there's no black key between E and F."
"l1.3.answer.bs" = "B♯ is on C: there's no black key between B and C."
"l1.3.enharmonic" = "E♯ and F, B♯ and C: two names for one key. They're called enharmonic notes."
"l1.3.chromatic" = "To finish, every key, one by one, going up: C, C♯, D, D♯, E, F, F♯, G, G♯, A, A♯, B, C."
"l1.3.bravo" = "Well done! You now know every key on the keyboard."
"a1.3.hello" = "Let's practise sharps. I say the notes in letters, and you play them."
"find.Db" = "Find a D♭."
"find.Eb" = "Find an E♭."
"find.Gb" = "Find a G♭."
"find.Ab" = "Find an A♭."
"find.Bb" = "Find a B♭."
"find.reb" = "Find a ré♭."
"find.mib" = "Find a mi♭."
"find.solb" = "Find a sol♭."
"find.lab" = "Find a la♭."
"find.sib" = "Find a si♭."
"l1.4.hello" = "The black keys have another name. A flat is a note lowered one notch, toward the left of the keyboard."
"l1.4.sign" = "A flat is written with this sign: ♭. D flat is written D♭; in French, ré♭."
"l1.4.d.down" = "D, then D♭: the note goes down a notch. After me."
"l1.4.b.down" = "B, then B♭."
"l1.4.find" = "Your turn: find the black keys by their flats."
"l1.4.play.cs" = "Play a C♯."
"l1.4.play.db" = "And now, a D♭."
"l1.4.two.names" = "It's the same key! Every black key has two names: musicians do like to make things complicated. C♯ and D♭ are enharmonic, like E♯ and F."
"l1.4.guess.fb" = "And F♭? Where do you think it is?"
"l1.4.guess.cb" = "And C♭?"
"l1.4.nope" = "No, it's not there. Remember: a flat is a note lowered one notch."
"l1.4.answer.fb" = "F♭ is on E: there's no black key between E and F."
"l1.4.answer.cb" = "C♭ is on B: there's no black key between B and C."
"l1.4.chromatic" = "Every key, one by one, going down: C, B, B♭, A, A♭, G, G♭, F, E, E♭, D, D♭, C."
"l1.4.chromatic.scale" = "The twelve keys, played one by one, going up or down: that's the chromatic scale."
"l1.4.bravo" = "Well done! You can name every key on the keyboard, every way."
"a1.4.hello" = "Let's practise flats. I say the notes in letters, and you play them."
"l1e.chord" = "Here's a chord, as a grid writes it: E♭7."
"l1e.root" = "E♭ is the root of E♭7, and of E♭6, E♭m or E♭maj7(♯11) too: the note at the start, with its sharp or flat. What the rest of the symbol means, we'll find out later."
"l1e.find.root" = "Find the root of this chord."
"l1e.find.next" = "And of this one?"
"l1e.grid" = "A grid is the music behind a song: its chords, written bar by bar. Here's a line of the blues: four bars, a chord a bar."
"l1e.bass" = "In a grid, you'll play the bass: the root of each chord, one note a bar."
"l1e.listen" = "Listen first: C, F, C, C, on the double bass."
"l1e.octave" = "If your keyboard has only two octaves, press \"Oct −\" twice: it goes down two octaves, and you play the bass where it sounds."
"l1e.your.turn" = "Your turn: the root of each bar. Take your time, the grid waits for you; but aim right the first time."
"l1e.bravo" = "Well done! You can read a line of a grid. Next comes the whole grid."
"activity.traps" = "And now, watch out for traps!"

