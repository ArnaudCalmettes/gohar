"l1.1.hello" = "Hi! Before we play together, let's get to know the keyboard."
"l1.1.pairs" = "See these pairs of black keys? They're everywhere."
"l1.1.press.pair" = "Press the two black keys of a pair, together."
"l1.1.trios" = "And these groups of three black keys? They're everywhere too."
"l1.1.press.trio" = "Press the three black keys of a group, together."
"l1.1.do" = "Just left of a pair, that's C. In French, do."
"l1.1.find.do" = "Find a C."
"l1.1.fa" = "Just left of a group of three, that's F. In French, fa."
"l1.1.find.fa" = "Find an F."
"l1.1.find.c" = "Find a do."
"l1.1.find.f" = "Find a fa."
"l1.1.five" = "From C, the white keys are C, D, E, F, G, in the order of the alphabet. In French: do, ré, mi, fa, sol."
"l1.1.sing" = "C, D, E, F, G: play them after me, and sing them as you go."
"l1.1.sing.down" = "And back down: G, F, E, D, C."
"l1.1.motifs" = "Now play back what I play, after me. You can use both hands if it's easier."
"l1.1.motif.re" = "C, D, C: after me."
"l1.1.motif.mi" = "C, E, C."
"l1.1.motif.fa" = "C, F, C."
"l1.1.motif.sol" = "C, G, C."
"l1.1.bravo" = "Well done! You know your first notes."
"activity.hello" = "Let's practise the motifs of the lesson, all from C. First, play after me."
"activity.after" = "After me."
"activity.letters" = "Now I'll say them in letters, and you play them."
"letters.CDC" = "C, D, C."
"letters.CEC" = "C, E, C."
