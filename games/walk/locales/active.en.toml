"activity.sing" = "Remember to sing what you play: that's how the ear learns."
"activity.mixed" = "And now both, mixed: sometimes I play, sometimes I say."
"activity.sing.again" = "Still singing?"
"activity.bravo" = "Well done! Come back and practise whenever you like."
"remind.slowly" = "Take your time: one note after the other, cleanly, with one finger if need be."
"l1.2.scale.up" = "C, D, E, F, G, A, B, C: after me, singing. (No need to keep in rhythm: take your time, even with one finger.)"
"l1.2.scale.down" = "And back down: C, B, A, G, F, E, D, C."
"l1.2.letters" = "Careful: after G, the alphabet starts again at A. C, D, E, F, G, A, B. In French: do, ré, mi, fa, sol, la, si."
"l1.2.play.letters" = "Play C, D, E, F, G, A, B."
"l1.2.humpf" = "Hmph! It can't end like that… something's missing."
"l1.2.thanks" = "Ah! Thank you! Much better."
"l1.2.trick" = "A trick: C and F are left of the groups of two and three black keys. E and B are right of those same groups."
"l1.2.motifs" = "Now some motifs going down: C in the right hand, the other note in the left. Play after me, singing."
"l1.2.motif.si" = "C, B, C."
"l1.2.motif.la" = "C, A, C."
"l1.2.motif.sol" = "C, G, C."
"l1.2.bravo" = "Well done! You know all seven white keys, in both notations."
"l1.2.review" = "Before going further, one last review: play C, D, E, F, G."
"l1.2.hello" = "C, D, E, F, G: you've got them. Let's go on."
"l1.2.find" = "To finish, find the notes I ask for, anywhere on the keyboard."
"find.C" = "Find a C."
"find.D" = "Find a D."
"find.E" = "Find an E."
"find.F" = "Find an F."
"find.G" = "Find a G."
"find.A" = "Find an A."
"find.B" = "Find a B."
